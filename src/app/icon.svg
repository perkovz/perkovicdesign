<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" role="img" aria-label="Perkovic Design Studio">
  <!--
    Filled adaptation of LeafIcon (src/components/Icons.tsx), the 28×28 mark
    beside the home-page promise “Prove your AI agent behaves before you ship it.”
    Source path: M4 24C4 12 12 4 24 4C24 16 16 24 4 24Z
    The live mark is a 1.5px #4F6B55 stroke with a thin vein (M4 24L18 10).
    The vein is omitted so the silhouette stays legible at 16px; no thin strokes.
  -->
  <style>
    .leaf { fill: #4F6B55; }
    @media (prefers-color-scheme: dark) {
      .leaf { fill: #A9BFA3; }
    }
  </style>
  <path class="leaf" d="M4 24C4 12 12 4 24 4C24 16 16 24 4 24Z"/>
</svg>
